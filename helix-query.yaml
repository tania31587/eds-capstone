version: 1

indices:
  default:
    include:
      - /**

    exclude:
      - /nav/**
      - /footer/**
      - /fragments/**
      - /drafts/**

    target: /query-index.json

    properties:
      path:
        select: none
        value: path

      title:
        select: title
        value: textContent(el)

      description:
        select: meta[name="description"]
        value: attribute(el, "content")